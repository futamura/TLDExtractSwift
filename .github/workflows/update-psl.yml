# Refreshes the bundled Public Suffix List and opens a pull request when it changed.

name: Update Public Suffix List

on:
  schedule:
    - cron: "0 3 * * 1" # Every Monday at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update_psl:
    name: Update Public Suffix List
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: develop
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Refresh the list
        run: python update-psl.py
      - name: Check whether the list changed
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The bundled list already matches upstream."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      ### The pull request this job opens carries no checks of its own (see the
      ### token note below), so the parser is exercised against the new list
      ### here instead. A list that breaks the tests fails this run and never
      ### reaches a pull request.
      - name: Test against the refreshed list
        if: steps.check.outputs.changed == 'true'
        run: docker run --rm -v "$PWD:/package" -w /package swift:6.2 swift test -c debug
      - name: Create pull request
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          ### A pull request opened with GITHUB_TOKEN does not trigger workflows,
          ### so CI stays unreported until someone closes and reopens it. Set the
          ### PSL_UPDATE_TOKEN secret to a PAT to have CI run automatically.
          token: ${{ secrets.PSL_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          base: develop
          branch: chore/update-psl
          commit-message: "chore: refresh the bundled Public Suffix List"
          title: "chore: refresh the bundled Public Suffix List"
          body: |
            The Public Suffix List changed upstream. Regenerated by
            `update-psl.py`, which rewrites both bundled `.dat` resources and
            the `SPM_PSL` literal from a single download.

            The parser tests already ran against this list in the workflow that
            opened the pull request. Checks may be absent here — a pull request
            opened with `GITHUB_TOKEN` does not trigger workflows; close and
            reopen it to start them.
          delete-branch: true
