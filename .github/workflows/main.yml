# This workflow will build and test the Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Test Framework

on:
  push:
    branches:
      - main
      - develop
    paths:
      - .github/workflows/**
      - .swift-format
      - Package.swift
      - Package.resolved
      - TLDExtractSwift.xcodeproj/**
      - Sources/**
      - Tests/**
      - Resources/**
  ### No paths filter on pull_request: the "CI Success" job is a required status
  ### check on main, so it must report on every PR (a filtered-out workflow would
  ### leave the check "expected" forever and block merging docs-only PRs).
  pull_request:
    branches:
      - main
      - develop

env:
  project_name: TLDExtractSwift
  scheme: TLDExtractSwift

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_code:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full git history is needed to get a proper list of changed files
      - name: Lint
        uses: mtgto/swift-format-action@main
        with:
          configuration_file: .swift-format # Please comment out if you won't specify configuration file
          all_files: false # default is false
          max_warnings: -1 # default is -1 (infinity)

  ### Uses the default Xcode of each runner image so the matrix keeps working as images update.
  test_macOS:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runsOn: macos-26
            name: "Test: macOS 26, Xcode 26"
            coverage: YES
          - runsOn: macos-15
            name: "Test: macOS 15, Xcode 16.4"
            coverage: NO
    steps:
      - uses: actions/checkout@v7
      - name: ${{ matrix.name }}
        run: |-
          set -o pipefail && env NSUnbufferedIO=YES xcodebuild -project "${{ env.project_name }}.xcodeproj" -scheme ${{ env.scheme }} -destination "platform=macOS" -enableCodeCoverage ${{ matrix.coverage }} clean test | xcbeautify --renderer github-actions
      - name: Upload coverage to Codecov
        if: ${{ matrix.coverage == 'YES' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
    needs: lint_code

  test_Catalyst:
    name: "Test: Catalyst"
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Catalyst
        run: set -o pipefail && env NSUnbufferedIO=YES xcodebuild -project "${{ env.project_name }}.xcodeproj" -scheme ${{ env.scheme }} -destination "platform=macOS,variant=Mac Catalyst" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean test 2>&1 | xcbeautify --renderer github-actions
    needs: lint_code

  ### Simulator device names change with every Xcode release, so resolve an available
  ### device at runtime via simctl instead of hardcoding names that rot.
  test_simulators:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "iOS"
            osFilter: "SimRuntime\\.iOS"
            devicePrefix: "iPhone"
            runsOn: macos-26
            name: "Test: iOS, Xcode 26"
          - platform: "iOS"
            osFilter: "SimRuntime\\.iOS"
            devicePrefix: "iPhone"
            runsOn: macos-15
            name: "Test: iOS, Xcode 16.4"
          - platform: "tvOS"
            osFilter: "SimRuntime\\.tvOS"
            devicePrefix: "Apple TV"
            runsOn: macos-26
            name: "Test: tvOS, Xcode 26"
          - platform: "tvOS"
            osFilter: "SimRuntime\\.tvOS"
            devicePrefix: "Apple TV"
            runsOn: macos-15
            name: "Test: tvOS, Xcode 16.4"
          - platform: "watchOS"
            osFilter: "SimRuntime\\.watchOS"
            devicePrefix: "Apple Watch"
            runsOn: macos-26
            name: "Test: watchOS, Xcode 26"
          - platform: "watchOS"
            osFilter: "SimRuntime\\.watchOS"
            devicePrefix: "Apple Watch"
            runsOn: macos-15
            name: "Test: watchOS, Xcode 16.4"
          - platform: "visionOS"
            osFilter: "(xrOS|visionOS)"
            devicePrefix: "Apple Vision"
            runsOn: macos-26
            name: "Test: visionOS, Xcode 26"
    steps:
      - uses: actions/checkout@v7
      - name: ${{ matrix.name }}
        run: |
          set -o pipefail
          device=$(xcrun simctl list devices available -j \
            | jq -r --arg os "${{ matrix.osFilter }}" '.devices | to_entries[] | select(.key | test($os)) | .value[] | .name' \
            | grep -F "${{ matrix.devicePrefix }}" | head -1)
          if [ -z "$device" ]; then
            echo "::error::No available ${{ matrix.platform }} simulator matching '${{ matrix.devicePrefix }}' on this image."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Testing on simulator: $device"
          env NSUnbufferedIO=YES xcodebuild -project "${{ env.project_name }}.xcodeproj" -scheme ${{ env.scheme }} -destination "platform=${{ matrix.platform }} Simulator,name=$device" clean test 2>&1 | xcbeautify --renderer github-actions
    needs: lint_code

  SPM:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runsOn }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runsOn: macos-26
            name: "SPM: macOS 26, Xcode 26"
          - runsOn: macos-15
            name: "SPM: macOS 15, Xcode 16.4"
    steps:
      - uses: actions/checkout@v7
      - name: Test SPM
        run: swift test -c debug 2>&1 | xcbeautify --renderer github-actions
    needs: [test_macOS, test_Catalyst, test_simulators]

  SPM_linux:
    name: "SPM: Linux, Swift 6.2"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: swift:6.2
    steps:
      - uses: actions/checkout@v7
      - name: Test SPM
        run: swift test -c debug
    needs: [test_macOS, test_Catalyst, test_simulators]

  ### Carthage builds are no longer verified by CI (Carthage is in maintenance mode;
  ### compatibility is kept on a best-effort basis via the Xcode project).
  ### CocoaPods distribution has ended (the trunk becomes read-only on 2026-12-02);
  ### 3.0.0 is the last version published as a pod.

  ### Aggregate gate used as the sole required status check on main.
  ### Matrix job names change with Xcode versions; this name must stay stable.
  ci_success:
    name: CI Success
    runs-on: ubuntu-latest
    if: always()
    needs: [lint_code, test_macOS, test_Catalyst, test_simulators, SPM, SPM_linux]
    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs failed or were cancelled."
            exit 1
          fi
          echo "All required jobs succeeded."
