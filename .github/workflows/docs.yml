# Builds the DocC documentation site and deploys it to GitHub Pages
# on every push to the default branch.

name: Docs

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued, but never cancel an in-progress deployment.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy DocC site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate documentation
        run: ./scripts/gen_docs.sh docc-site

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docc-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
